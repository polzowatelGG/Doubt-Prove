# echidna.yaml — конфиг для сравнения с LLM-фаззером (Фаза 6.5)
#
# testMode: property — Echidna ищет последовательность вызовов, после
#   которой любая из echidna_*() функций вернёт false.
# testLimit: сколько случайных транзакций всего попробовать перед тем
#   как сдаться (аналог наших MAX_ITERATIONS, но здесь это отдельные
#   ТРАНЗАКЦИИ, а не целые сценарии — сравнение не 1:1, см. пояснение
#   в чате и шаг 6 плана — единый бюджет по времени, а не по числу
#   транзакций).
# seqLen: максимальная длина одной случайной последовательности вызовов
#   перед проверкой инвариантов и откатом состояния. 20 — с запасом,
#   нашей атаке нужно минимум 3 логических вызова в правильном порядке
#   (doDeposit -> armReentry -> doWithdraw) среди случайного шума.

testMode: property
testLimit: 50000
seqLen: 20
prefix: "echidna_"

# Возможность отправлять ETH вместе с вызовом payable-функций (doDeposit)
# — это встроенное поведение Echidna по умолчанию, отдельно включать не
# нужно; НЕ регулируется maxGasprice (это распространённая путаница —
# maxGasprice отвечает только за цену газа случайных транзакций).
maxGasprice: 0

# Сохраняем найденные последовательности вызовов между запусками — при
# находке бага здесь будет лежать минимальный воспроизводящий сценарий
# (аналог build/fuzzer_bridge_report.json у LLM-фаззера), плюс не нужно
# начинать поиск с нуля при повторном прогоне с другим testLimit.
corpusDir: corpus